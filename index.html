<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Posicionamento com Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
            <h1>CineBox</h1>
            <p>Praticando CSS Grid</p>

            <div class="catalogo">

                <!-- ARTICLE -> Indica conteúdo próprio/independente -->
                <article class="filme">
                    <img src="imgs/AOdisseia.jpg" alt="">

                </article>
                <article class="filme">
                    <img src="imgs/Avatar.jpg" alt="">
                    <h3>Filme 2</h3>
                </article>
                <article class="filme">
                    <img src="imgs/Invocacao4.webp" alt="">
                    <h3>Filme 3</h3>
                </article>
                <article class="filme">
                    <img src="imgs/MinionsEMonstros.webp" alt="">
                    <h3>Filme 4</h3>
                </article>
                <article class="filme">
                    <img src="imgs/Moana2.jpg" alt="">
                    <h3>Filme 5</h3>
                </article>
                <article class="filme">
                    <img src="imgs/Obsessao.webp" alt="">
                    <h3>Filme 6</h3>
                </article>
            </div>
        </section>

</html>
